<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; padding: 24px; color: #2c3e50; }
.header { margin-bottom: 24px; }
.header h1 { font-size: 26px; color: #1a237e; font-weight: 700; margin-bottom: 4px; }
.header .subtitle { color: #78909c; font-size: 14px; }
.dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; }
.card {
  background: #ffffff; border-radius: 12px; padding: 20px;
  border: 1px solid #e8ecf1; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: all 0.2s;
}
.card:hover { border-color: #bbdefb; box-shadow: 0 4px 16px rgba(25,118,210,0.08); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.loc-name { font-size: 20px; font-weight: 700; color: #1a237e; letter-spacing: 0.3px; }
.badge {
  background: #e3f2fd; color: #1565c0;
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px solid #bbdefb; white-space: nowrap;
}
.numbers-row { display: flex; gap: 28px; margin: 8px 0 6px 0; align-items: baseline; }
.num-block { display: flex; flex-direction: column; }
.num-value { font-size: 36px; font-weight: 800; color: #1565c0; line-height: 1.1; }
.num-value.green { color: #2e7d32; }
.num-value.gray { color: #90a4ae; font-size: 24px; }
.num-label { font-size: 11px; color: #78909c; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.stats-row { display: flex; gap: 24px; padding: 8px 0; border-top: 1px solid #eceff1; border-bottom: 1px solid #eceff1; margin-bottom: 8px; }
.stat { font-size: 13px; color: #78909c; }
.stat strong { color: #37474f; font-size: 15px; }
.bar-container { background: #eceff1; border-radius: 8px; height: 6px; margin: 8px 0; overflow: hidden; }
.bar { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #42a5f5, #1565c0); transition: width 0.6s ease; }
.sku-list { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
.sku-list.open { max-height: 5000px; }
.sku-item {
  padding: 8px 0; border-bottom: 1px solid #eceff1;
  font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start;
}
.sku-item:last-child { border: none; }
.sku-code { font-weight: 600; color: #1565c0; font-size: 11px; font-family: 'Cascadia Code', 'Consolas', monospace; background: #e3f2fd; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.sku-desc { color: #546e7a; font-size: 12px; }
.sku-qty { color: #37474f; font-weight: 600; white-space: nowrap; font-size: 12px; text-align: right; }
.sku-locs { grid-column: 1 / -1; color: #78909c; font-size: 11px; padding: 2px 0 0 0; }
.sku-locs span { display: inline-block; background: #f5f7fa; padding: 1px 7px; border-radius: 4px; margin: 1px 3px; color: #546e7a; border: 1px solid #e8ecf1; font-size: 10px; }
@media print {
  body { background: #fff; padding: 12px; color: #000 !important; }
  .card { border: 2px solid #000 !important; box-shadow: none !important; break-inside: avoid; padding: 14px; }
  .card:hover { border-color: #000 !important; box-shadow: none !important; }
  .loc-name { font-size: 22px; color: #000 !important; font-weight: 900 !important; }
  .badge { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; font-weight: 700 !important; }
  .num-value { color: #000 !important; font-weight: 900 !important; }
  .num-value.green { color: #000 !important; }
  .num-value.gray { color: #000 !important; font-weight: 800 !important; }
  .num-label { color: #000 !important; font-weight: 700 !important; }
  .stat { color: #000 !important; font-weight: 600 !important; }
  .stat strong { color: #000 !important; font-weight: 900 !important; font-size: 16px; }
  .bar-container, .bar { display: none; }
  .sku-code { color: #000 !important; font-weight: 800 !important; background: #f0f0f0 !important; }
  .sku-desc { color: #000 !important; font-weight: 600 !important; }
  .sku-qty { color: #000 !important; font-weight: 800 !important; }
  .sku-locs { color: #000 !important; font-weight: 500 !important; }
  .sku-locs span { color: #000 !important; font-weight: 500 !important; border: 1px solid #000 !important; background: #fff !important; }
  .toggle-btn, .download-btn, .btn-row, .controls, .drop-zone, .header .subtitle { display: none !important; }
  .sku-list { max-height: none !important; overflow: visible !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.toggle-btn, .download-btn {
  background: #f5f7fa; border: 1px solid #e0e0e0;
  color: #1565c0; font-size: 12px; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-weight: 600;
  transition: all 0.15s;
}
.toggle-btn:hover, .download-btn:hover { background: #e3f2fd; border-color: #90caf9; }
.download-btn { color: #2e7d32; width: auto; margin-top: 6px; }
.download-btn:hover { background: #e8f5e9; border-color: #a5d6a7; }
.btn-row { display: flex; gap: 6px; margin-top: 6px; }
.btn-row .toggle-btn { margin-top: 0; }
.btn-row .download-btn { margin-top: 0; }
.controls { margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search-box {
  padding: 9px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
  width: 260px; font-size: 13px; outline: none; background: #fff; color: #333; transition: border 0.15s;
}
.search-box:focus { border-color: #42a5f5; }
.search-box::placeholder { color: #b0bec5; }
.filter-btn {
  padding: 7px 14px; border-radius: 8px; border: 2px solid #e0e0e0;
  background: #fff; color: #78909c; cursor: pointer; font-size: 12px; font-weight: 600;
  transition: all 0.15s;

.filter-btn.active { border-color: #1565c0; background: #e3f2fd; color: #1565c0; }
.filter-btn:hover { border-color: #90caf9; color: #1565c0; }
.drop-zone {
  border: 2px dashed #bbdefb; border-radius: 10px; padding: 14px; text-align: center;
  background: #fff; margin-bottom: 16px; cursor: pointer; transition: all 0.2s;
  color: #78909c; font-size: 13px;
}
.drop-zone:hover, .drop-zone.dragover { border-color: #1565c0; background: #e3f2fd; color: #1565c0; }
</style>
</head>

// Drag & Drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = (e) => { if (e.target.files[0]) readFile(e.target.files[0]); };
  input.click();
});
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

      const wb = XLSX.read(e.target.result, { type: 'array' });
      processExcel(wb);
      document.getElementById('dropContent').textContent = 'Actualizado: ' + file.name;
      document.getElementById('statusText').textContent = 'Datos actualizados desde ' + file.name;
    } catch (err) {
      alert('Error al leer el archivo: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function processExcel(workbook) {
  // Read using header row to map columns by name
  const ws = workbook.Sheets[workbook.SheetNames[0]];
  const rowsRaw = XLSX.utils.sheet_to_json(ws, { defval: '', range: 1 });
  const rows = [];
  for (const r of rowsRaw) {
    const loc = r['LOC'] || r['Loc'] || r['loc'] || r['Ubicacion'] || '';
    const sku = r['SKU'] || r['Sku'] || r['sku'] || r['Codigo'] || r['Articulo'] || '';
    const qty = r['Cant'] || r['Cant.'] || r['cant'] || r['Cantidad'] || r['Stock'] || '';
    const desc = r['Descrip'] || r['Desc'] || r['desc'] || r['Descripcion'] || r['Producto'] || '';
    if (loc && sku) {
      rows.push({ loc: String(loc).trim(), sku: String(sku).trim(), qty: Number(qty) || 0, desc: String(desc || '').trim() });
    }
  }
  const excluir = new Set(['PICKTO','ANALISIS','INVNEG0205']);
  const skuLocs = {}, totalSkusPorLoc = {};
  for (const r of rows) {
    if (excluir.has(r.loc)) continue;
    if (!skuLocs[r.sku]) skuLocs[r.sku] = [];
    skuLocs[r.sku].push(r.loc);
    if (!totalSkusPorLoc[r.loc]) totalSkusPorLoc[r.loc] = new Set();
    totalSkusPorLoc[r.loc].add(r.sku);
  }

  // Find exclusive SKUs (only in one location)
  const exclusivosPorLoc = {};
  for (const sku in skuLocs) {
    const uniqueLocs = [...new Set(skuLocs[sku])];
    if (uniqueLocs.length === 1) {
      const loc = uniqueLocs[0];
      if (!exclusivosPorLoc[loc]) exclusivosPorLoc[loc] = [];
      const totalQty = rows.filter(r => r.sku === sku && r.loc === loc).reduce((s, r) => s + r.qty, 0);
      const desc = rows.find(r => r.sku === sku)?.desc || '';
      exclusivosPorLoc[loc].push([sku, desc, totalQty]);
    }
  }
  for (const loc in exclusivosPorLoc) {
    exclusivosPorLoc[loc].sort((a, b) => b[2] - a[2]);
  }

  // Qty per SKU per location
  const qtyPorSkuLoc = {};
  for (const r of rows) {
    if (excluir.has(r.loc)) continue;
    if (!qtyPorSkuLoc[r.sku]) qtyPorSkuLoc[r.sku] = {};
    qtyPorSkuLoc[r.sku][r.loc] = (qtyPorSkuLoc[r.sku][r.loc] || 0) + r.qty;
  }

  const locData = {};
  for (const r of rows) {
    if (excluir.has(r.loc)) continue;
    const uniqueLocs = [...new Set(skuLocs[r.sku])];
    if (uniqueLocs.length <= 1) continue;
    if (!locData[r.loc]) locData[r.loc] = {};
    if (!locData[r.loc][r.sku]) {
      const locsWithQty = uniqueLocs.map(l => [l, qtyPorSkuLoc[r.sku][l] || 0]).sort((a, b) => b[1] - a[1]);
      locData[r.loc][r.sku] = { qty: 0, desc: r.desc, allLocs: locsWithQty };
    }
    locData[r.loc][r.sku].qty += r.qty;
  }

  const items = [];
  const allLocs = Object.keys(totalSkusPorLoc).sort();
  for (const loc of allLocs) {
    const totalSkusUbi = totalSkusPorLoc[loc].size;
    const redistSkus = locData[loc] ? Object.entries(locData[loc]) : [];
    const qtyRedist = redistSkus.reduce((s, [,v]) => s + v.qty, 0);
    const allUbis = new Set();
    for (const [,v] of redistSkus) v.allLocs.forEach(([loc]) => allUbis.add(loc));
    const detail = redistSkus.map(([code, v]) => [code, v.desc, v.qty, [...v.allLocs]]).sort((a, b) => b[2] - a[2]);
    const exclusivos = exclusivosPorLoc[loc] || [];
    items.push({ loc, total_skus: totalSkusUbi, skus_redist: redistSkus.length, skus_exclusivos: totalSkusUbi - redistSkus.length, total_qty: qtyRedist, total_ubis: allUbis.size, skus_detail: detail, skus_exclusivos_list: exclusivos });
  }
  items.sort((a, b) => b.skus_redist - a.skus_redist);
  data = items;
  render(items);
}

function render(items) {
  const maxSkus = Math.max(...items.map(i => i.skus_redist), 1);
  const container = document.getElementById('dashboard');
  container.innerHTML = items.map(item => {
    const pct = Math.round(item.skus_redist / maxSkus * 100);
    const estable = item.skus_redist === 0;
    return `
      <div class="card" data-loc="${item.loc}">
        <div class="card-header">
          <span class="loc-name">${item.loc}</span>
          ${estable
            ? `<span class="badge" style="background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;">Ubicacion estable</span>`
            : `<span class="badge">${item.skus_redist} de ${item.total_skus} redistribuibles</span>`}
        </div>
        <div class="numbers-row">
          <div class="num-block"><div class="num-value">${item.total_skus}</div><span class="num-label">SKUs totales</span></div>
          <div class="num-block"><div class="num-value green">${item.skus_redist}</div><span class="num-label">redistribuibles</span></div>
          <div class="num-block"><div class="num-value gray">${item.skus_exclusivos}</div><span class="num-label">solo aqui</span></div>
        </div>
        ${estable ? `<div style="margin:6px 0;font-size:13px;color:#2e7d32;font-weight:500;">Todos los SKUs pertenecen solo a esta ubicacion</div>`
        : `<div class="stats-row">
          <span class="stat">Unidades a redistribuir: <strong>${item.total_qty.toLocaleString()}</strong></span>
          <span class="stat">Ubicaciones destino: <strong>${item.total_ubis}</strong></span>
          ${item._bajo !== undefined ? `<span class="stat">Bajo stock <50: <strong style="color:#e65100">${item._bajo}</strong></span>` : ''}
        </div>
        <div class="bar-container"><div class="bar" style="width:${pct}%"></div></div>`}
        <div class="btn-row">
          <button class="toggle-btn" onclick="toggle('${item.loc}')">Ver detalle ▼</button>
          ${!estable ? `<button class="download-btn" onclick="downloadCSV('${item.loc}')">Descargar Excel</button>` : ''}
        </div>
        <div class="sku-list" id="list-${item.loc.replace(/[^a-zA-Z0-9]/g,'')}">
          ${item.skus_detail.map(s => {
            const [code, desc, qty, allLocs] = s;
            return `<div class="sku-item">
              <span class="sku-code">${code}</span>
              <span class="sku-desc">${desc}</span>
              <span class="sku-qty">${qty} uds</span>
              <div class="sku-locs">Ya existe en: ${allLocs.map(([loc, lqty]) => '<span>' + loc + ' (' + lqty + ')</span>').join('')}</div>
            </div>`;
          }).join('')}
          ${item.skus_exclusivos_list && item.skus_exclusivos_list.length > 0 ? `
          <div style="margin-top:8px;padding-top:8px;border-top:2px solid #e8ecf1;">
            <div style="font-size:12px;font-weight:600;color:#2e7d32;margin-bottom:4px;">SKUs exclusivos (solo aqui)</div>
            ${item.skus_exclusivos_list.map(s => {
              const [code, desc, qty] = s;
              return `<div class="sku-item">
                <span class="sku-code">${code}</span>
                <span class="sku-desc">${desc}</span>
                <span class="sku-qty">${qty} uds</span>
                <div class="sku-locs" style="color:#2e7d32;">Solo en esta ubicacion</div>
              </div>`;
            }).join('')}
          </div>` : ''}
        </div>
      </div>`;
  }).join('');
}
function toggle(loc) {
  const el = document.getElementById('list-' + loc.replace(/[^a-zA-Z0-9]/g,''));
  el.classList.toggle('open');
}

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    c.style.display = c.dataset.loc.toLowerCase().includes(q) ? '' : 'none';
  });
}

function downloadCSV(loc) {
  const item = data.find(i => i.loc === loc);
  if (!item) return;

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Dashboard Redistribucion';
  const ws = wb.addWorksheet('Redistribucion');

  const borderStyle = {
    top: { style: 'thin' },
    bottom: { style: 'thin' },
    left: { style: 'thin' },
    right: { style: 'thin' }
  };
  const centerAlign = { horizontal: 'center', vertical: 'center', wrapText: true };
  const boldFont = { bold: true, size: 11 };

  function addRow(vals, isHeader) {
    const r = ws.addRow(vals);
    r.eachCell(c => {
      c.alignment = centerAlign;
      c.border = borderStyle;
      if (isHeader) c.font = boldFont;
    });
    return r;
  }

  addRow(['SKU', 'Descripcion', 'Unidades en ' + loc, 'OB'], true);

  for (const [code, desc, qty] of item.skus_detail) {
    addRow([code, desc, qty, '']);
  }

  if (item.skus_exclusivos_list && item.skus_exclusivos_list.length) {
    ws.addRow([]);
    const sep = addRow(['--- SKUs EXCLUSIVOS (solo en ' + loc + ') ---']);
    sep.eachCell(c => { c.font = { bold: true, size: 11, color: { argb: 'FF1B5E20' } }; });

    addRow(['SKU', 'Descripcion', 'Unidades', ''], true);

    for (const [code, desc, qty] of item.skus_exclusivos_list) {
      const r = addRow([code, desc, qty, 'EXCLUSIVO']);
      r.eachCell(c => { c.font = { italic: true, color: { argb: 'FF1B5E20' } }; });
    }
  }

  ws.addRow([]);
  addRow(['Resumen'], true);
  addRow(['SKUs totales en ' + loc, item.total_skus]);
  addRow(['SKUs redistribuibles', item.skus_redist]);
  addRow(['SKUs exclusivos', item.skus_exclusivos]);
  addRow(['Unidades a redistribuir', item.total_qty]);
  addRow(['Ubicaciones destino', item.total_ubis]);

  ws.getColumn(1).width = 20;
  ws.getColumn(2).width = 50;
  ws.getColumn(3).width = 18;
  ws.getColumn(4).width = 30;

  wb.xlsx.writeBuffer().then(buf => {
    const blob = new Blob([buf], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `redistribucion_${loc}.xlsx`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
}

function sortBy(type) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + type).classList.add('active');
  let sorted = [...data];
  if (type === 'skus_redist') sorted.sort((a,b) => b.skus_redist - a.skus_redist);
  else if (type === 'total_skus') sorted.sort((a,b) => b.total_skus - a.total_skus);
  else if (type === 'total_qty') sorted.sort((a,b) => b.total_qty - a.total_qty);
  else if (type === 'bajo_stock') {
    for (const loc of sorted) {
      loc._bajo = loc.skus_detail.filter(s => s[2] < 50).length;
    }
    sorted.sort((a,b) => b._bajo - a._bajo);
  }
  render(sorted);
}

render(data);
</script>
